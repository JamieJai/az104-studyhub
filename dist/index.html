<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070D14">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@200;300;400;500;600&display=swap" rel="stylesheet">
  <title>Azure Study Home · 로그인</title>
  <style>
    /* 노선도(/map/)와 같은 팔레트 */
    :root{
      --bg:#070D14; --plate:#111E29; --plate-hi:#182835;
      --gold:#C6A05C; --gold-2:#E0C48A; --gold-soft:rgba(198,160,92,.3);
      --ink:#E9EFF5; --ink2:#AABAC8; --muted:#71828F;
      --hair:rgba(198,160,92,.18); --hair2:rgba(160,185,205,.12);
      --infra:#3D9BE9; --sec:#9A78E0; --data:#49B37A; --bad:#E0645A; --ok:#49B37A;
    }
    @media (prefers-color-scheme: light){
      :root:not([data-theme="dark"]){
        --bg:#FAF9F6; --plate:#FFFFFF; --plate-hi:#F3F1EC; --ink:#111D28; --ink2:#44576A; --muted:#7D8C9A;
        --hair:rgba(140,110,50,.24); --hair2:rgba(20,40,60,.11); --gold:#9A7630; --gold-2:#B08F45;
      }
    }
    *{box-sizing:border-box}
    html{height:100%}
    body{min-height:100dvh}
    body{
      margin:0;background:var(--bg);color:var(--ink);
      font-family:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.65;
      -webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:28px 16px;
      background-image:
        radial-gradient(1200px 600px at 50% -10%, rgba(61,155,233,.10), transparent 60%),
        radial-gradient(800px 500px at 100% 100%, rgba(198,160,92,.07), transparent 60%);
    }

    /* ============ 인트로 (노선도와 같은 엠블럼) ============ */
    #intro{position:fixed;inset:0;z-index:100;background:#070D14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;cursor:pointer}
    #intro.out{animation:introOut .9s cubic-bezier(.4,0,.2,1) forwards}
    @keyframes introOut{to{opacity:0;transform:scale(1.07);visibility:hidden}}
    #intro .emb{width:132px;height:150px;overflow:visible}
    #intro .sh{fill:none;stroke:#E0C48A;stroke-width:2.2;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.25s cubic-bezier(.35,.1,.2,1) .25s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    #intro .shfill{fill:#0E1A24;opacity:0;animation:fadeIn .7s ease 1.1s forwards}
    #intro .nd{opacity:0;animation:pop .5s cubic-bezier(.3,1.5,.5,1) forwards}
    @keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:none}}
    #intro .spine{stroke:#C6A05C;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-dasharray:160;stroke-dashoffset:160;animation:draw .7s ease 1.15s forwards}
    @keyframes fadeIn{to{opacity:1}}
    #intro .wm{font-family:"Barlow Condensed",sans-serif;font-weight:500;font-size:clamp(20px,5.6vw,32px);color:#EAF1F7;letter-spacing:.7em;text-indent:.7em;opacity:0;animation:wmIn 1.1s cubic-bezier(.2,.7,.3,1) 1.25s forwards;white-space:nowrap}
    @keyframes wmIn{0%{opacity:0;letter-spacing:1.3em}100%{opacity:1;letter-spacing:.7em}}
    #intro .wsub{font-size:12.5px;font-weight:200;color:#6F8090;letter-spacing:.36em;text-indent:.36em;opacity:0;animation:fadeIn .9s ease 1.75s forwards}
    #intro .skip{position:absolute;bottom:34px;font-size:11.5px;color:#4E5E6C;letter-spacing:.14em;font-weight:200;opacity:0;animation:fadeIn .6s ease 2.1s forwards}

    /* ============ 로그인 카드 ============ */
    .card{
      width:100%;max-width:440px;padding:36px 34px 28px;background:var(--plate);
      border:1px solid var(--hair);border-radius:4px;box-shadow:0 24px 60px rgba(0,0,0,.45);
      opacity:0;transform:translateY(10px);animation:cardIn .7s cubic-bezier(.2,.7,.3,1) forwards;
    }
    @keyframes cardIn{to{opacity:1;transform:none}}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
    .brand svg{width:26px;height:30px;flex:0 0 auto}
    .brand .t{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:20px;letter-spacing:.26em;text-indent:.05em;color:var(--ink);line-height:1.1}
    .brand .s{font-size:11.5px;font-weight:200;color:var(--muted);letter-spacing:.24em;margin-top:3px}
    h1{margin:0 0 6px;font-size:20px;font-weight:500;letter-spacing:-.01em}
    .lead{margin:0 0 20px;color:var(--ink2);font-size:13.5px;font-weight:300;line-height:1.7}
    label{display:block;font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:500;letter-spacing:.16em;color:var(--gold);margin:14px 0 6px}
    input{
      width:100%;padding:12px 14px;background:var(--plate-hi);color:var(--ink);border:1px solid var(--hair2);border-radius:3px;
      font:inherit;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s;
    }
    input::placeholder{color:var(--muted);font-weight:300}
    input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
    .actions{display:flex;gap:10px;margin-top:22px}
    button{flex:1;padding:12px 10px;border-radius:3px;border:1px solid var(--gold);font-family:"Barlow Condensed",sans-serif;font-size:16px;font-weight:600;letter-spacing:.14em;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
    .primary{background:var(--gold);color:#0B141C}
    .primary:hover{background:var(--gold-2)}
    .secondary{background:transparent;color:var(--gold)}
    .secondary:hover{background:rgba(198,160,92,.12)}
    button:disabled{opacity:.55;cursor:wait}
    .msg{min-height:20px;margin:12px 0 0;font-size:13px;color:var(--bad)}
    .msg.ok{color:var(--ok)}
    .signup-only{display:none}
    .mode-signup .signup-only{display:block}

    .note{margin:18px 0 0;font-size:11.5px;color:var(--muted);font-weight:300;line-height:1.6;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
    .note a{color:var(--muted)}
    @media (max-width:440px){.card{padding:28px 22px 22px}.actions{flex-direction:column}}
  </style>
</head>
<body>
  <div id="intro" role="presentation">
    <svg class="emb" viewBox="-50 -56 100 112" aria-hidden="true">
      <path class="shfill" d="M -31 -46 H 31 A 8 8 0 0 1 39 -38 V 8 C 39 32, 16 42, 0 48 C -16 42, -39 32, -39 8 V -38 A 8 8 0 0 1 -31 -46 Z"/>
      <path class="sh" d="M -31 -46 H 31 A 8 8 0 0 1 39 -38 V 8 C 39 32, 16 42, 0 48 C -16 42, -39 32, -39 8 V -38 A 8 8 0 0 1 -31 -46 Z"/>
      <path class="spine" d="M -19 16 L -3 -4 L 5 6 L 20 -22"/>
      <g class="nd" style="animation-delay:1.35s"><circle cx="-19" cy="16" r="5.2" fill="#3D9BE9"/></g>
      <g class="nd" style="animation-delay:1.5s"><circle cx="-3" cy="-4" r="5.2" fill="#9A78E0"/></g>
      <g class="nd" style="animation-delay:1.65s"><circle cx="5" cy="6" r="5.2" fill="#49B37A"/></g>
      <g class="nd" style="animation-delay:1.8s"><circle cx="20" cy="-22" r="6.4" fill="#C6A05C"/></g>
    </svg>
    <div class="wm">AZURE STUDY HOME</div>
    <div class="wsub">자격증 노선도 · CBT · 실습 랩</div>
    <div class="skip">화면을 누르면 건너뜁니다</div>
  </div>

  <main class="card" id="card">
    <div class="brand">
      <svg viewBox="-44 -50 88 100" aria-hidden="true">
        <path d="M -28 -42 H 28 A 7 7 0 0 1 35 -35 V 6 C 35 28, 14 38, 0 44 C -14 38, -35 28, -35 6 V -35 A 7 7 0 0 1 -28 -42 Z" fill="none" stroke="var(--gold)" stroke-width="3.4"/>
        <path d="M -17 14 L -3 -4 L 5 5 L 18 -19" fill="none" stroke="var(--gold)" stroke-width="3.4" stroke-linecap="round"/>
      </svg>
      <div><div class="t">AZURE STUDY HOME</div><div class="s">CERTIFICATION MAP · CBT · LAB</div></div>
    </div>
    <h1 id="title">로그인하고 이어서 공부하기</h1>
    <p class="lead" id="lead">로그인하면 자격증 노선도에서 과목을 골라 CBT와 실습 랩으로 들어갑니다. 풀이 기록은 서버에만 저장되어 어느 기기에서든 같은 상태로 이어집니다.</p>

    <form id="form" autocomplete="on">
      <label for="name">NAME</label>
      <input id="name" name="username" type="text" placeholder="영문·숫자·밑줄·하이픈 3자 이상" autocomplete="username" spellcheck="false" maxlength="64" required>
      <label for="pw">PASSWORD</label>
      <input id="pw" name="password" type="password" placeholder="4자 이상" autocomplete="current-password" maxlength="128" required>
      <label for="pw2" class="signup-only">CONFIRM PASSWORD</label>
      <input id="pw2" class="signup-only" type="password" placeholder="한 번 더 입력" autocomplete="new-password" maxlength="128">
      <p class="msg" id="msg"></p>
      <div class="actions">
        <button type="submit" class="primary" id="submit">로그인</button>
        <button type="button" class="secondary" id="toggle">회원가입</button>
      </div>
    </form>


    <p class="note"><span>3시간 동안 활동이 없으면 자동으로 로그아웃됩니다.</span><a href="./admin/">관리</a></p>
  </main>

  <script>
    (() => {
      const $ = id => document.getElementById(id);

      // ----- 인트로 (노선도와 같은 엠블럼 애니메이션)
      const intro = $("intro");
      let introDone = false;
      function endIntro() {
        if (introDone) return; introDone = true;
        intro.classList.add("out");
        setTimeout(() => intro.remove(), 950);
      }
      intro.addEventListener("click", endIntro);
      document.addEventListener("keydown", function once() { endIntro(); document.removeEventListener("keydown", once); });
      setTimeout(endIntro, 2900);

      // ----- 로그인/가입 (로직은 이전 버전과 동일)
      const card = $("card"), form = $("form"), name = $("name"), pw = $("pw"), pw2 = $("pw2"), msg = $("msg"), submit = $("submit"), toggle = $("toggle");
      let signup = false;
      const next = new URLSearchParams(location.search).get("next");
      const dest = next && next.startsWith("/") && !next.startsWith("//") ? next : "/map/";
      const ERR = {
        invalid_name: "이름은 영문·숫자·밑줄·하이픈으로 3~64자여야 합니다.",
        invalid_password: "비밀번호는 4자 이상이어야 합니다.",
        name_taken: "이미 사용 중인 이름입니다. 로그인하거나 다른 이름을 쓰세요.",
        bad_credentials: "이름 또는 비밀번호가 맞지 않습니다.",
        user_limit: "가입 인원이 가득 찼습니다. 관리자에게 문의하세요.",
        auth_secret_missing: "서버 설정이 아직 끝나지 않았습니다 (AUTH_SECRET).",
      };

      function setMode(s) {
        signup = s;
        card.classList.toggle("mode-signup", s);
        submit.textContent = s ? "가입하고 시작" : "로그인";
        toggle.textContent = s ? "로그인으로" : "회원가입";
        pw.autocomplete = s ? "new-password" : "current-password";
        msg.textContent = ""; msg.className = "msg";
        $("title").textContent = s ? "새 계정 만들기" : "로그인하고 이어서 공부하기";
        $("lead").textContent = s
          ? "새 이름과 비밀번호를 정하면 계정이 만들어집니다. 같은 이름의 예전 기록이 있으면 자동으로 가져옵니다."
          : "로그인하면 자격증 노선도에서 과목을 골라 CBT와 실습 랩으로 들어갑니다. 풀이 기록은 서버에만 저장되어 어느 기기에서든 같은 상태로 이어집니다.";
      }
      toggle.addEventListener("click", () => setMode(!signup));

      // 이미 세션이 있으면 바로 이동 (서버 미들웨어도 같은 일을 하지만, 캐시된 페이지가 뜬 경우 대비)
      fetch("/api/auth/me", { cache: "no-store" }).then(r => { if (r.ok) location.replace(dest); }).catch(() => {});

      form.addEventListener("submit", async e => {
        e.preventDefault();
        const n = name.value.trim(), p = pw.value;
        if (!/^[A-Za-z0-9_-]{3,64}$/.test(n)) { msg.textContent = ERR.invalid_name; return; }
        if (p.length < 4) { msg.textContent = ERR.invalid_password; return; }
        if (signup && p !== pw2.value) { msg.textContent = "비밀번호 확인이 일치하지 않습니다."; return; }
        submit.disabled = true; toggle.disabled = true;
        msg.className = "msg"; msg.textContent = signup ? "계정을 만드는 중…" : "로그인 중…";
        try {
          const r = await fetch(signup ? "/api/auth/signup" : "/api/auth/login", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: n, password: p })
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(data?.error || r.status);
          const m = data.migrated;
          msg.className = "msg ok";
          msg.textContent = m && m.progress ? `예전 기록 ${m.progress}건을 가져왔습니다. 이동합니다…` : "확인되었습니다. 이동합니다…";
          location.replace(dest);
        } catch (err) {
          msg.className = "msg";
          msg.textContent = ERR[err.message] || `실패했습니다 (${err.message}). 잠시 후 다시 시도하세요.`;
          submit.disabled = false; toggle.disabled = false;
        }
      });
      name.focus();
    })();
  </script>
</body>
</html>
