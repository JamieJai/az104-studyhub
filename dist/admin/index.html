<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Azure Study Home · 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* 노선도(/map/)·로그인과 같은 다크 팔레트 */
    :root{
      --bg:#070D14; --plate:#111E29; --plate-hi:#182835; --gold:#C6A05C; --gold-2:#E0C48A; --gold-soft:rgba(198,160,92,.3);
      --ink:#E9EFF5; --ink2:#AABAC8; --muted:#71828F; --hair:rgba(198,160,92,.18); --hair2:rgba(160,185,205,.12);
      --infra:#3D9BE9; --sec:#9A78E0; --bad:#E0645A; --ok:#49B37A;
    }
    *{box-sizing:border-box}
    body{margin:0;padding:24px 16px;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
      background-image:radial-gradient(1200px 600px at 50% -10%, rgba(61,155,233,.08), transparent 60%)}
    .wrap{max-width:1040px;margin:0 auto}
    .card{background:var(--plate);border:1px solid var(--hair);border-radius:4px;padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.4);margin-bottom:14px}
    h1{margin:0 0 2px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:22px;letter-spacing:.2em;color:var(--ink)}
    h2{margin:0 0 12px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;letter-spacing:.18em;color:var(--gold)}
    .sub{margin:0 0 14px;color:var(--muted);font-size:12.5px;font-weight:300}
    input{padding:10px 12px;background:var(--plate-hi);color:var(--ink);border:1px solid var(--hair2);border-radius:3px;font:inherit;font-size:14px;outline:none;width:100%;max-width:280px}
    input::placeholder{color:var(--muted)}
    input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
    button{padding:7px 12px;border-radius:3px;border:1px solid var(--hair2);background:transparent;font-family:"Barlow Condensed",sans-serif;font-size:14px;font-weight:600;letter-spacing:.1em;cursor:pointer;color:var(--ink2);transition:.15s}
    button:hover{border-color:var(--gold);color:var(--gold)}
    button.primary{background:var(--gold);border-color:var(--gold);color:#0B141C}
    button.primary:hover{background:var(--gold-2)}
    button.danger{color:var(--bad)}
    button.danger:hover{border-color:var(--bad);background:rgba(224,100,90,.12)}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .msg{font-size:13px;color:var(--bad);min-height:18px;margin:8px 0 0}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:6px}
    .stat{background:var(--plate-hi);border:1px solid var(--hair2);border-radius:3px;padding:10px 12px}
    .stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600;letter-spacing:.04em;color:var(--gold-2)}
    .stat span{font-size:11.5px;color:var(--muted);letter-spacing:.06em}
    .tbl{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th,td{padding:8px 10px;border-bottom:1px solid var(--hair2);text-align:left;white-space:nowrap;vertical-align:top}
    th{color:var(--muted);font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.14em}
    td.num{text-align:right;font-variant-numeric:tabular-nums}
    td .row{gap:6px;flex-wrap:nowrap}
    .exam{display:inline-block;padding:1px 8px;border-radius:2px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.1em;border:1px solid}
    .exam.az104{color:var(--infra);border-color:rgba(61,155,233,.5)} .exam.az802{color:var(--sec);border-color:rgba(154,120,224,.5)}
    .empty{color:var(--muted);font-size:13px;padding:8px 0}
    .note{font-size:12px;color:var(--ink2);white-space:pre-wrap;max-width:420px;font-weight:300}
    #app{display:none}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
    .topbar a{color:var(--muted);font-size:13px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="login">
      <h1>ADMIN PORTAL</h1>
      <p class="sub">Azure Study Home · 사용자·진도·오답 신고 관리</p>
      <form id="lform" class="row" autocomplete="off">
        <input id="lname" placeholder="아이디" autocomplete="username">
        <input id="lpw" type="password" placeholder="비밀번호" autocomplete="current-password">
        <button class="primary" type="submit">로그인</button>
      </form>
      <p class="msg" id="lmsg"></p>
    </div>

    <div id="app">
      <div class="topbar">
        <div><h1>ADMIN PORTAL</h1><p class="sub" id="updated"></p></div>
        <div class="row"><a href="/">로그인 페이지</a><button id="refresh">새로고침</button><button id="logout">로그아웃</button></div>
      </div>

      <div class="card">
        <h2>저장 현황</h2>
        <div class="stats" id="stats"></div>
        <p class="sub" id="quota"></p>
      </div>

      <div class="card">
        <h2>사용자</h2>
        <div class="tbl"><table><thead><tr>
          <th>#</th><th>이름</th><th>가입</th><th>최근 로그인</th><th>최근 저장</th>
          <th style="text-align:right">진도</th><th style="text-align:right">모의고사</th><th style="text-align:right">신고</th><th>작업</th>
        </tr></thead><tbody id="users"></tbody></table></div>
        <p class="empty" id="usersEmpty" hidden>사용자가 없습니다.</p>
      </div>

      <div class="card">
        <div class="row" style="justify-content:space-between"><h2>오답 신고 <span id="rcount"></span></h2><button class="danger" id="delAllReports">신고 전부 삭제</button></div>
        <div class="tbl"><table><thead><tr><th>시각</th><th>사용자</th><th>시험</th><th>문항</th><th>유형</th><th>내 답</th><th>채점</th><th>메모</th></tr></thead><tbody id="reports"></tbody></table></div>
        <p class="empty" id="reportsEmpty" hidden>신고가 없습니다.</p>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const API = "/api/admin/";
      const fmt = iso => iso ? new Date(iso).toLocaleString("ko-KR", { hour12: false }) : "—";
      const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
      const EXAM_LABEL = { az104: "AZ-104", az802: "AZ-802" };
      const KIND = { "wrong-answer": "정답 오류", "bad-explanation": "해설 문제", translation: "번역·오탈자", image: "이미지", other: "기타" };

      async function call(path, opts) {
        const r = await fetch(API + path, { cache: "no-store", ...opts });
        if (r.status === 401) { show(false); throw new Error("unauthorized"); }
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data?.error || r.status);
        return data;
      }
      function show(loggedIn) { $("login").style.display = loggedIn ? "none" : "block"; $("app").style.display = loggedIn ? "block" : "none"; }

      async function load() {
        const [ov, rp] = await Promise.all([call("overview"), call("reports")]);
        const t = ov.totals || {};
        $("stats").innerHTML = [
          ["사용자", `${t.users} / ${ov.maxUsers ?? "-"}`], ["진도 행", t.progress], ["모의고사", t.exam_runs], ["신고", t.reports], ["세션", t.sessions],
          ["데이터 크기", (ov.approxBytes / 1024).toFixed(1) + " KB"],
        ].map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span>${k}</span></div>`).join("");
        const rows = (t.progress || 0) + (t.exam_runs || 0) + (t.reports || 0) + (t.sessions || 0) + (t.users || 0);
        $("quota").textContent = `총 ${rows.toLocaleString()}행 · D1 무료 한도: 저장 5 GB, 하루 읽기 500만 행 / 쓰기 10만 행`;
        $("updated").textContent = "기준 " + fmt(new Date().toISOString());

        const users = ov.users || [];
        $("usersEmpty").hidden = users.length > 0;
        $("users").innerHTML = users.map(u => `<tr>
          <td>${u.id}</td><td><b>${esc(u.name)}</b></td><td>${fmt(u.created_at)}</td><td>${fmt(u.last_login)}</td><td>${fmt(u.last_saved)}</td>
          <td class="num">${u.progress}</td><td class="num">${u.exam_runs}</td><td class="num">${u.reports}</td>
          <td><div class="row">
            <button data-act="progress" data-id="${u.id}" data-name="${esc(u.name)}">진도 비우기</button>
            <button data-act="reports" data-id="${u.id}" data-name="${esc(u.name)}">신고 삭제</button>
            <button class="danger" data-act="user" data-id="${u.id}" data-name="${esc(u.name)}">계정 삭제</button>
          </div></td></tr>`).join("");

        const reports = rp.reports || [];
        $("rcount").textContent = `(${reports.length})`;
        $("reportsEmpty").hidden = reports.length > 0;
        $("reports").innerHTML = reports.map(r => `<tr>
          <td>${fmt(r.at)}</td><td>${esc(r.owner)}</td><td><span class="exam ${esc(r.exam || "az104")}">${esc(EXAM_LABEL[r.exam] || r.exam || "AZ-104")}</span></td><td>src ${r.source}${r.practice ? ` (P${r.practice})` : ""}</td>
          <td>${esc(KIND[r.kind] || r.kind)}</td><td>${esc(r.myAnswer)}</td><td>${esc(r.graded)}</td><td class="note">${esc(r.note)}</td></tr>`).join("");
      }

      $("users").addEventListener("click", async e => {
        const b = e.target.closest("button[data-act]"); if (!b) return;
        const { act, id, name } = b.dataset;
        const q = act === "user" ? `'${name}' 계정과 모든 기록을 삭제합니다. 되돌릴 수 없습니다.`
                : act === "progress" ? `'${name}'의 진도·세션·모의고사 기록을 비웁니다. 계정은 남습니다.`
                : `'${name}'의 신고를 모두 삭제합니다.`;
        if (!confirm(q)) return;
        try { await call(`${act}?id=${id}`, { method: "DELETE" }); await load(); } catch (err) { alert("실패: " + err.message); }
      });
      $("delAllReports").addEventListener("click", async () => {
        if (!confirm("모든 사용자의 신고를 전부 삭제합니다.")) return;
        try { await call("reports", { method: "DELETE" }); await load(); } catch (err) { alert("실패: " + err.message); }
      });
      $("refresh").addEventListener("click", () => load().catch(() => {}));
      $("logout").addEventListener("click", async () => { await fetch(API + "logout", { method: "POST" }); show(false); });

      $("lform").addEventListener("submit", async e => {
        e.preventDefault();
        $("lmsg").textContent = "";
        try {
          await call("login", { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: $("lname").value.trim(), password: $("lpw").value }) });
          show(true); await load();
        } catch (err) { $("lmsg").textContent = err.message === "bad_credentials" ? "아이디 또는 비밀번호가 맞지 않습니다." : "실패: " + err.message; }
      });

      // 이미 관리자 세션이 있으면 바로 표시
      call("me").then(() => { show(true); return load(); }).catch(() => show(false));
    })();
  </script>
</body>
</html>
