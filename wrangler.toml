name = "az104-studyhub-p8"
pages_build_output_dir = "dist"
compatibility_date = "2026-01-01"

# 바인딩은 2026-09-18 정상 배포(2875b494)의 설정과 동일하게 맞춘다.
# 시크릿(AUTH_SECRET, ADMIN_PASS)은 프로젝트에 저장되어 있으므로 여기 적지 않는다.
#   설정: npx wrangler pages secret put AUTH_SECRET / ADMIN_PASS

[vars]
ADMIN_USER = "admin"
MAX_USERS = "10"

# 옛 KV 진도 (가입 시 D1으로 이관하는 용도로만 읽는다)
[[kv_namespaces]]
binding = "PROGRESS"
id = "3e533eed1c07458f896f46f2f5422c1d"

# D1: 사용자·진도·신고 (서버가 유일한 기준)
[[d1_databases]]
binding = "DB"
database_name = "az104-studyhub"
database_id = "d4c72a23-2101-422b-85ea-cb01222711da"
